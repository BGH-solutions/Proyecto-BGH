<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentos - Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link rel="stylesheet" href="tb.css"> 
</head>

<body>

    <header class="header">


        <img src="logo.png" alt="Hospital de Clínicas" class="logo">

        <div class="usuario">
            <span>Tipo de usuario</span>
            <span>Nombre de usuario</span>
            <i class="bi bi-list"></i>
        </div>

    </header>
    
    <nav class="menu">
        <ul>
            <li class="active"><a href="documentos.html"> Documentos </a></li>
            <li><a href="encuesta.html"> Encuesta</a></li>
        </ul>
    </nav>
    
    <main class="contenido">

        <h2 class="titulo">
            Documentos agregados recientemente
        </h2>

        <div class="filtro d-flex align-items-center justify-content-end gap-2 mb-3">
            <label for="selectFiltro" class="fw-bold mb-0">Filtrar <i class="bi bi-funnel"></i></label>
            <select id="selectFiltro" class="form-select w-auto" onchange="filtrarOpciones(this.value)">
                <option value="" selected disabled>Seleccionar orden...</option>
                <option value="nombre">Nombre (A-Z)</option>
                <option value="categoria">Categoría (A-Z)</option>
                <option value="fecha">Fecha (Más reciente)</option>
            </select>
        </div>

        <div class="tabla-container">

            <table class="tabla-documentos">

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Fecha</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

        <div class="botones mb-3">
            <a href="agregar.html" class="btn boton">Agregar documento</a>
            <a href="editar.html" class="btn boton">Editar documento</a>
            <a href="eliminar.html" class="btn boton">Eliminar documento</a>
        </div>
    </main>

    <script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js)"></script>
    <script src="tb.js"></script>
</body>
</html>
