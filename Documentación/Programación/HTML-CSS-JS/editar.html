<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="tb.css">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h2>Editar Documento</h2>
        <form id="editarForm">
            <div class="mb-3">
                <label for="documentoSelect" class="form-label">Selecciona el documento a editar:</label>
                <select id="documentoSelect" class="form-select" required>
                    <option value="">Seleccione un documento...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nuevo nombre personalizado:</label>
                <input type="text" id="nombre" class="form-control" required disabled>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Nueva categoría:</label>
                <select id="categoria" class="form-select" required disabled>
                    <option value="Indicaciones de interrupción voluntaria del embarazo.">Indicaciones de interrupción voluntaria del embarazo.</option>
                    <option value="Prostatectomía radical.">Prostatectomía radical (indicaciones e información para el paciente).</option>
                    <option value="Preparación para estudios imagenológicos.">Preparación para estudios imagenológicos.</option>
                    <option value="Estudios diagnósticos con pertecnetato.">Estudios diagnósticos con pertecnetato.</option>
                    <option value="Centellograma de perfusión miocárdica.">Centellograma de perfusión miocárdica.</option>
                    <option value="Indicaciones ecocardiograma con dobutamina.">Indicaciones ecocardiograma con dobutamina.</option>
                    <option value="Indicaciones para pacientes en tratamiento con warfarina.">Indicaciones para pacientes en tratamiento con warfarina.</option>
                    <option value="Indicaciones ecocardiograma transesofágico.">Indicaciones ecocardiograma transesofágico.</option>
                    <option value="Indicaciones para ingreso a centro de nefrología y trasplante.">Indicaciones para ingreso a centro de nefrología y trasplante.</option>
                    <option value="Plan de alta enfermería, Nefrología.">Plan de alta enfermería, Nefrología.</option>
                    <option value="Indicaciones de enfermería para usuarios trasplantados.">Indicaciones de enfermería para usuarios trasplantados.</option>
                    <option value="Prevención de infecciones.">Prevención de infecciones.</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="documentos.html" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary" id="btnGuardar" disabled>Guardar Cambios</button>
            </div>
        </form>
    </div>

    <script src="editar.js"></script>
</body>
</html>
