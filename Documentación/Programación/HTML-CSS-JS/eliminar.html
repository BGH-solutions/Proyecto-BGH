<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="tb.css">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h2>Eliminar Documento</h2>
        <form id="eliminarForm">
            <div class="mb-3">
                <label for="documentoSelect" class="form-label">Selecciona el documento a eliminar:</label>
                <select id="documentoSelect" class="form-select" required>
                    <!-- Se llena con JavaScript -->
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="documentos.html" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </div>
        </form>
    </div>

    <script src="eliminar.js"></script>
</body>
</html>
